name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate skill and documentation
        run: python scripts/check.py
      - name: Check distribution and offline evaluator behavior
        run: python -m unittest discover -s tests -v
      - name: Validate evaluation plan without model calls
        run: python scripts/run-evals.py
      - name: Package plugin
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: we-need-to-talk-plugin
          path: |
            dist/*.zip
            dist/*.sha256
